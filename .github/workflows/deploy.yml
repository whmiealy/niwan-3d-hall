# 展馆已并入资源库网站：https://whmiealy.github.io/museum3d/hall/
# 这里只发布一个跳转页，让旧链接和旧二维码继续可用。展馆的实际发布见 docs/交接说明.md。
name: Deploy redirect to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>泥玩世家 · 3D 展厅</title>
              <meta http-equiv="refresh" content="0; url=https://whmiealy.github.io/museum3d/hall/" />
              <script>location.replace('https://whmiealy.github.io/museum3d/hall/' + location.hash);</script>
            </head>
            <body>
              <p>展厅已搬家：<a href="https://whmiealy.github.io/museum3d/hall/">点这里进入</a></p>
            </body>
          </html>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
